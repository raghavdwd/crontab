name: Deploy Server to VM

on:
  push:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /home/ubuntu/crontab/server

            git pull origin main

            # Stop all containers using port 3000
            docker ps -q --filter "publish=3000" | xargs -r docker rm -f

            # Build new image
            docker build -t crontab-server .

            # Run new container
            docker run -d \
              --name crontab-server \
              -p 3000:3000 \
              --env-file .env \
              --restart unless-stopped \
              crontab-server

            # Optional cleanup
            docker image prune -f